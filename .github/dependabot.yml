#
# Keeps the dependency surfaces visible: the GitHub Actions in the workflows, the backend's pinned
# Python wheels, the frontend's npm lockfile and the Dockerfile base images.
#
# GitHub is a push mirror of the Forgejo repo, so these PRs can never be merged here: the next
# mirror sync deletes the dependabot/* branches and GitHub auto-closes the PR within minutes. They
# are a heads-up, not a merge queue. The real update lands as a commit on Forgejo. Hence a monthly
# cadence and one grouped PR per ecosystem and update kind, instead of one PR per package per week
# (which re-opened the same ~10 PRs every Wednesday). Security advisories don't wait for this
# schedule: the weekly `Security audit` workflow and GitHub's Dependabot alerts cover them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: monthly
    groups:
      ml:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    ignore:
      # Blocked upstream, not by us. Remove the entry once the blocker clears.
      # eslint 10: eslint-config-next pulls eslint-plugin-react / -import / -jsx-a11y, whose peer
      # ranges stop at eslint 9 (the 2026-10 Dependabot PR failed `npm ci` on exactly that).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler; typescript-eslint doesn't support it yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/", "/ml"]
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]
