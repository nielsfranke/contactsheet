#
# Runs the test suites on every push to main and on PRs: backend pytest, frontend lint + Vitest +
# build, and the Playwright end-to-end smoke (a real browser against live backend + frontend).
# See docs/architecture/e2e-smoke-tests.md.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    # Only run on GitHub Actions; the Forgejo mirror has no runner today (mirrors release.yml).
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Match the runtime image (python:3.12-slim) so pinned wheels (e.g. rawpy) resolve.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  frontend-unit:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Catalog parity + ICU/argument checks — CLAUDE.md calls this mandatory before a commit,
      # so CI enforces it: a missing key would otherwise render raw in production.
      - run: node scripts/validate-i18n.mjs
      - run: npm test
      - run: npm run build

  e2e:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      # The browser download (~170 MB) only changes when the playwright pin in
      # requirements-dev.txt moves; `install` below is a no-op on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements-dev.txt') }}
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # The e2e conftest builds the frontend + boots both servers on ephemeral ports. One retry
      # (pytest-rerunfailures) absorbs a browser-timing flake without hiding a real regression —
      # a test that fails twice still fails the job.
      - name: Run end-to-end smoke
        run: pytest e2e/ -o addopts="" --reruns 1
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            **/trace.zip
          if-no-files-found: ignore
